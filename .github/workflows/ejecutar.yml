name: Ejecutar Tabulacion IA

on:
  workflow_dispatch: 

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías de Python
        run: |
          pip install pymupdf groq google-genai pandas openpyxl requests Pillow

      - name: Instalar conector de Google Drive (rclone)
        run: sudo apt-get install rclone

      - name: Configurar acceso a Google Drive
        run: |
          mkdir -p ~/.config/rclone
          cat << EOF > ~/.config/rclone/rclone.conf
          [midrive]
          type = drive
          client_id = ${{ secrets.DRIVE_CLIENT_ID }}
          client_secret = ${{ secrets.DRIVE_CLIENT_SECRET }}
          scope = drive.readonly
          token = {"access_token":"dummy","token_type":"Bearer","refresh_token":"${{ secrets.DRIVE_REFRESH_TOKEN }}","expiry":"2023-01-01T00:00:00Z"}
          EOF

      - name: Descargar PDFs desde tus carpetas compartidas
        run: |
          echo "Descargando Cartas Enviadas desde Compartido conmigo..."
          rclone copy "midrive:15_01_Cartas_Enviadas" ./15_01_Cartas_Enviadas --drive-shared-with-me -v
          echo "Descargando Comunicaciones Recibidas desde Compartido conmigo..."
          rclone copy "midrive:15_04_Comunic_Recibidas" ./15_04_Comunic_Recibidas --drive-shared-with-me -v

      - name: Ejecutar la IA de Tabulación
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python script.py

      - name: Guardar memoria para no repetir PDFs mañana
        run: |
          git config --global user.name "Bot-Memoria"
          git config --global user.email "bot@github.com"
          git add RESTREPO_2_IA_memoria.csv
          git commit -m "Actualizar memoria de PDFs procesados" || echo "No hay cambios nuevos"
          git push
