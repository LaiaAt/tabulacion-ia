name: Ejecutar Tabulacion IA

on:
  workflow_dispatch:
    inputs:
      es_prueba:
        description: '¿Ejecución de prueba? (si/no)'
        type: choice
        options:
          - 'no'
          - 'si'
        default: 'no'
      limite_prueba:
        description: 'Si es prueba, ¿cuántos archivos AL AZAR por flujo?'
        required: false
        default: '5'
      alcance:
        description: '¿Tabular todo o un año específico? (Escribe "todo" o el año, ej. "2017")'
        required: true
        default: '2017'

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Permiso para guardar la memoria en caso de corte

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías de Python
        run: |
          pip install pymupdf google-genai pandas openpyxl requests Pillow

      - name: Instalar conector de Google Drive (rclone)
        run: sudo apt-get install rclone

      - name: Configurar acceso a Google Drive
        run: |
          mkdir -p ~/.config/rclone
          cat << EOF > ~/.config/rclone/rclone.conf
          [midrive]
          type = drive
          client_id = ${{ secrets.DRIVE_CLIENT_ID }}
          client_secret = ${{ secrets.DRIVE_CLIENT_SECRET }}
          scope = drive.readonly
          token = {"access_token":"dummy","token_type":"Bearer","refresh_token":"${{ secrets.DRIVE_REFRESH_TOKEN }}","expiry":"2023-01-01T00:00:00Z"}
          EOF

      - name: Descarga Inteligente de PDFs desde Drive
        run: |
          if [ "${{ inputs.alcance }}" = "todo" ]; then
            FILTRO="**.[pP][dD][fF]"
          else
            FILTRO="*${{ inputs.alcance }}*/**.[pP][dD][fF]"
          fi

          if [ "${{ inputs.es_prueba }}" = "si" ]; then
            echo "🎲 MODO PRUEBA: Sorteando ${{ inputs.limite_prueba }} archivos..."
            rclone lsf "midrive:15_01_Cartas_Enviadas" --drive-shared-with-me --include "$FILTRO" --files-only -R | shuf -n "${{ inputs.limite_prueba }}" > lista_enviadas.txt
            rclone copy "midrive:15_01_Cartas_Enviadas" ./15_01_Cartas_Enviadas --drive-shared-with-me --files-from lista_enviadas.txt -v

            rclone lsf "midrive:15_04_Comunic_Recibidas" --drive-shared-with-me --include "$FILTRO" --files-only -R | shuf -n "${{ inputs.limite_prueba }}" > lista_recibidas.txt
            rclone copy "midrive:15_04_Comunic_Recibidas" ./15_04_Comunic_Recibidas --drive-shared-with-me --files-from lista_recibidas.txt -v
          else
            echo "🚀 MODO PRODUCCIÓN: Descargando todos los PDFs..."
            rclone copy "midrive:15_01_Cartas_Enviadas" ./15_01_Cartas_Enviadas --drive-shared-with-me --include "$FILTRO" -v
            rclone copy "midrive:15_04_Comunic_Recibidas" ./15_04_Comunic_Recibidas --drive-shared-with-me --include "$FILTRO" -v
          fi

      - name: Ejecutar la IA de Tabulación (Multi-hilo)
        env:
          ES_PRUEBA: ${{ inputs.es_prueba }}
          LIMITE_PRUEBA: ${{ inputs.limite_prueba }}
          ALCANCE: ${{ inputs.alcance }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python script.py

      # Salvavidas: Guarda la memoria pase lo que pase (incluso si se cancela o falla)
      - name: Guardar Checkpoint de Memoria
        if: always()
        run: |
          git config --global user.name "Bot-Memoria"
          git config --global user.email "bot@github.com"
          git add RESTREPO_2_IA_memoria_*.csv || true
          git commit -m "Guardar avance de memoria automático" || true
          git push || true
