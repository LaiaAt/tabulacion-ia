name: Ejecutar Tabulacion IA

on:
  workflow_dispatch:
    inputs:
      es_prueba:
        description: '¿Ejecución de prueba? (si/no)'
        type: choice
        options:
          - 'no'
          - 'si'
        default: 'no'
      limite_prueba:
        description: 'Si es prueba, ¿cuántos archivos AL AZAR por flujo?'
        required: false
        default: '5'
      carpeta_objetivo:
        description: 'Escribe el nombre de la carpeta a tabular (ej. "2017" o "todo")'
        required: true
        default: '2017'
      reiniciar_memoria:
        description: '¿FORZAR reinicio desde cero borrando memoria vieja? (si/no)'
        type: choice
        options:
          - 'no'
          - 'si'
        default: 'no'

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio y memoria previa
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías de Python
        run: |
          pip install pymupdf google-genai pandas openpyxl requests Pillow

      - name: Instalar conector de Google Drive (rclone)
        run: sudo apt-get install rclone

      - name: Configurar acceso a Google Drive
        run: |
          mkdir -p ~/.config/rclone
          cat << EOF > ~/.config/rclone/rclone.conf
          [midrive]
          type = drive
          client_id = ${{ secrets.DRIVE_CLIENT_ID }}
          client_secret = ${{ secrets.DRIVE_CLIENT_SECRET }}
          scope = drive.readonly
          token = {"access_token":"dummy","token_type":"Bearer","refresh_token":"${{ secrets.DRIVE_REFRESH_TOKEN }}","expiry":"2023-01-01T00:00:00Z"}
          EOF

      - name: Fusión de Memorias y Descarga Quirúrgica Estricta
        run: |
          CARPETA="${{ inputs.carpeta_objetivo }}"
          echo "Consultando archivos en Drive para: $CARPETA"

          if [ "$CARPETA" = "todo" ]; then
            rclone lsf "midrive:15_01_Cartas_Enviadas" --drive-shared-with-me --include "**.[pP][dD][fF]" --files-only -R > drive_enviadas.txt
            rclone lsf "midrive:15_04_Comunic_Recibidas" --drive-shared-with-me --include "**.[pP][dD][fF]" --files-only -R > drive_recibidas.txt
          else
            rclone lsf "midrive:15_01_Cartas_Enviadas" --drive-shared-with-me --include "*${CARPETA}*/**.[pP][dD][fF]" --include "**/*${CARPETA}*/**.[pP][dD][fF]" --files-only -R > drive_enviadas.txt
            rclone lsf "midrive:15_04_Comunic_Recibidas" --drive-shared-with-me --include "*${CARPETA}*/**.[pP][dD][fF]" --include "**/*${CARPETA}*/**.[pP][dD][fF]" --files-only -R > drive_recibidas.txt
          fi

          python -c "
          import os, pandas as pd

          carpeta = '${{ inputs.carpeta_objetivo }}'
          es_prueba = '${{ inputs.es_prueba }}'
          reiniciar = '${{ inputs.reiniciar_memoria }}' == 'si'
          archivo_unificado = f'RESTREPO_2_IA_memoria_{carpeta}.csv'

          # 1. Buscar y fusionar todos los CSVs de memoria existentes para esta carpeta
          archivos_memoria = [f for f in os.listdir('.') if f.endswith('.csv') and 'memoria' in f.lower() and carpeta in f]
          
          buenos_filenames = set()

          if archivos_memoria and not reiniciar and es_prueba != 'si':
              dfs = []
              for f_mem in archivos_memoria:
                  try:
                      d = pd.read_csv(f_mem)
                      if not d.empty and 'UBICACION_ARCHIVO' in d.columns:
                          dfs.append(d)
                  except Exception as e:
                      print(f'Aviso leyendo {f_mem}: {e}')

              if dfs:
                  df = pd.concat(dfs, ignore_index=True).drop_duplicates(subset=['UBICACION_ARCHIVO'])
                  
                  # FÓRMULA DE EXCEL: Buscar CONSTATADO o SIN RADICADO en cualquier columna
                  tiene_constatado = df.astype(str).apply(
                      lambda col: col.str.contains('CONSTATADO|SIN RADICADO', case=False, na=False)
                  ).any(axis=1)

                  asunto_invalido = (
                      df['ASUNTO / TIPO DOCUMENTAL'].fillna('').astype(str).str.strip().isin(['', 'NONE', 'N/A']) |
                      df['ASUNTO / TIPO DOCUMENTAL'].astype(str).str.contains('CI004_', case=False, na=False)
                  )

                  malos = tiene_constatado | asunto_invalido
                  df_bueno = df[~malos]
                  df_bueno.to_csv(archivo_unificado, index=False)

                  print(f'✅ Memorias fusionadas: {len(df_bueno)} cartas buenas conservadas.')
                  print(f'🎯 Detectadas {malos.sum()} cartas con CONSTATADO para re-descargar y reparar.')

                  for ruta in df_bueno['UBICACION_ARCHIVO'].dropna():
                      buenos_filenames.add(os.path.basename(str(ruta).strip()).lower())

          # 2. Leer archivos que existen en Drive
          with open('drive_enviadas.txt') as f:
              todos_env = [line.strip() for line in f if line.strip()]
          with open('drive_recibidas.txt') as f:
              todos_rec = [line.strip() for line in f if line.strip()]

          # 3. Descargar ÚNICAMENTE los que no están en la lista de cartas buenas
          descargar_env = [x for x in todos_env if os.path.basename(x).lower() not in buenos_filenames]
          descargar_rec = [x for x in todos_rec if os.path.basename(x).lower() not in buenos_filenames]

          if es_prueba == 'si':
              import random
              limite = int('${{ inputs.limite_prueba }}' or '5')
              descargar_env = random.sample(descargar_env, min(len(descargar_env), limite))
              descargar_rec = random.sample(descargar_rec, min(len(descargar_rec), limite))

          print(f'\n🚀 DESCARGA QUIRÚRGICA REAL:')
          print(f'   - Enviadas/Radicadas a descargar: {len(descargar_env)}')
          print(f'   - Recibidas a descargar: {len(descargar_rec)}')
          print(f'   (Las {len(buenos_filenames)} cartas buenas NO se descargarán)')

          with open('descargar_enviadas.txt', 'w') as f:
              f.write('\n'.join(descargar_env))
          with open('descargar_recibidas.txt', 'w') as f:
              f.write('\n'.join(descargar_rec))
          "

          rclone copy "midrive:15_01_Cartas_Enviadas" ./15_01_Cartas_Enviadas --drive-shared-with-me --files-from descargar_enviadas.txt -v
          rclone copy "midrive:15_04_Comunic_Recibidas" ./15_04_Comunic_Recibidas --drive-shared-with-me --files-from descargar_recibidas.txt -v

      - name: Ejecutar la IA de Tabulación
        env:
          ES_PRUEBA: ${{ inputs.es_prueba }}
          LIMITE_PRUEBA: ${{ inputs.limite_prueba }}
          CARPETA_OBJETIVO: ${{ inputs.carpeta_objetivo }}
          REINICIAR_MEMORIA: ${{ inputs.reiniciar_memoria }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python script.py

      - name: Guardar Checkpoint de Memoria en GitHub
        if: always()
        run: |
          git config --global user.name "Bot-Memoria"
          git config --global user.email "bot@github.com"
          git pull --rebase origin main || true
          git add RESTREPO_2_IA_memoria_*.csv || true
          git commit -m "Checkpoint memoria automático [skip ci]" || echo "Sin cambios"
          git push origin main || true
