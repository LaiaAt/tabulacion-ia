name: Ejecutar Tabulacion IA

on:
  workflow_dispatch:
    inputs:
      es_prueba:
        description: '¿Ejecución de prueba? (si/no)'
        type: choice
        options:
          - 'no'
          - 'si'
        default: 'no'
      limite_prueba:
        description: 'Si es prueba, ¿cuántos archivos AL AZAR por flujo?'
        required: false
        default: '5'
      alcance:
        description: '¿Tabular todo o un año específico? (Escribe "todo" o el año, ej. "2017")'
        required: true
        default: '2017'

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías de Python
        run: |
          pip install pymupdf groq google-genai pandas openpyxl requests Pillow

      - name: Instalar conector de Google Drive (rclone)
        run: sudo apt-get install rclone

      - name: Configurar acceso a Google Drive
        run: |
          mkdir -p ~/.config/rclone
          cat << EOF > ~/.config/rclone/rclone.conf
          [midrive]
          type = drive
          client_id = ${{ secrets.DRIVE_CLIENT_ID }}
          client_secret = ${{ secrets.DRIVE_CLIENT_SECRET }}
          scope = drive.readonly
          token = {"access_token":"dummy","token_type":"Bearer","refresh_token":"${{ secrets.DRIVE_REFRESH_TOKEN }}","expiry":"2023-01-01T00:00:00Z"}
          EOF

      - name: Descargar PDFs de Google Drive (Filtro Enviadas y Recibidas Corregido)
        run: |
          if [ "${{ inputs.alcance }}" = "todo" ]; then
            echo "Modo: Tabular TODO"
            FILTRO="**.[pP][dD][fF]"
          else
            echo "Modo: Tabular año ${{ inputs.alcance }}"
            FILTRO="*${{ inputs.alcance }}*/**.[pP][dD][fF]"
          fi

          echo "Descargando Cartas Enviadas con filtro: $FILTRO"
          rclone copy "midrive:15_01_Cartas_Enviadas" ./15_01_Cartas_Enviadas --drive-shared-with-me --include "$FILTRO" -v
          
          echo "Descargando Comunicaciones Recibidas con filtro: $FILTRO"
          rclone copy "midrive:15_04_Comunic_Recibidas" ./15_04_Comunic_Recibidas --drive-shared-with-me --include "$FILTRO" -v

      - name: Ejecutar la IA de Tabulación
        env:
          ES_PRUEBA: ${{ inputs.es_prueba }}
          LIMITE_PRUEBA: ${{ inputs.limite_prueba }}
          ALCANCE: ${{ inputs.alcance }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python script.py

      - name: Guardar memoria para no repetir PDFs en el futuro
        run: |
          git config --global user.name "Bot-Memoria"
          git config --global user.email "bot@github.com"
          git add RESTREPO_2_IA_memoria.csv
          git commit -m "Actualizar memoria de PDFs procesados" || echo "No hay cambios nuevos"
          git push
