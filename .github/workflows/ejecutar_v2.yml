name: Ejecutar Rectificación IA v2

on:
  workflow_dispatch:
    inputs:
      carpeta_objetivo:
        description: 'Escribe el nombre del año/carpeta a rectificar (ej. "2017", "2020" o "2022")'
        required: true
        default: '2022'

jobs:
  rectificar-radicados:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python y Librerías
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install pymupdf pandas openpyxl requests Pillow

      - name: Instalar rclone
        run: sudo apt-get install -y rclone

      - name: Configurar acceso a Google Drive
        run: |
          mkdir -p ~/.config/rclone
          cat << EOF > ~/.config/rclone/rclone.conf
          [midrive]
          type = drive
          client_id = ${{ secrets.DRIVE_CLIENT_ID }}
          client_secret = ${{ secrets.DRIVE_CLIENT_SECRET }}
          scope = drive.readonly
          token = {"access_token":"dummy","token_type":"Bearer","refresh_token":"${{ secrets.DRIVE_REFRESH_TOKEN }}","expiry":"2023-01-01T00:00:00Z"}
          EOF

      - name: Identificar y Descargar ÚNICAMENTE los PDFs a Rectificar
        run: |
          CARPETA="${{ inputs.carpeta_objetivo }}"
          python -c "
          import os, pandas as pd

          carpeta = '${{ inputs.carpeta_objetivo }}'.strip()
          archivo_mem = f'RESTREPO_2_IA_memoria_{carpeta}.csv'

          if not os.path.exists(archivo_mem):
              print(f'❌ No se encontró la memoria {archivo_mem}')
              exit(1)

          df = pd.read_csv(archivo_mem)
          
          # Filtrar filas de Radicadas donde Destinatario sea Alto Magdalena y Radicado sea 'SIN NÚMERO' o no inicie con ALMA-
          es_rad = ~df['UBICACION_ARCHIVO'].astype(str).str.contains('Recibidas', case=False, na=False)
          dest_alma = df['RAZON SOCIAL DESTINATARIO'].astype(str).str.contains('MAGDALENA|ALMA', case=False, na=False)
          
          rad_dest = df['No. RADICADO DESTINATARIO'].fillna('').astype(str).str.strip()
          rad_invalido = (rad_dest.str.upper() == 'SIN NÚMERO') | (~rad_dest.str.upper().str.startswith('ALMA-'))

          a_rectificar = df[es_rad & dest_alma & rad_invalido]
          print(f'🎯 Se detectaron {len(a_rectificar)} cartas de Alto Magdalena a rectificar.')

          rutas_descarga = []
          for r in a_rectificar['UBICACION_ARCHIVO'].dropna():
              r_clean = str(r).replace('\\\\', '/').strip()
              # Quitar prefijo si ya lo incluye para la descarga en rclone
              if r_clean.startswith('15_01_Cartas_Enviadas/'):
                  r_clean = r_clean.replace('15_01_Cartas_Enviadas/', '', 1)
              rutas_descarga.append(r_clean)

          with open('descargar_pendientes.txt', 'w') as f:
              f.write('\n'.join(rutas_descarga))
          "

          if [ -s descargar_pendientes.txt ]; then
            echo "📥 Descargando únicamente los PDFs necesarios..."
            rclone copy "midrive:15_01_Cartas_Enviadas" ./15_01_Cartas_Enviadas --drive-shared-with-me --files-from descargar_pendientes.txt -v
          else
            echo "✅ No hay cartas pendientes por rectificar."
          fi

      - name: Ejecutar Rectificador Quirúrgico IA v2
        env:
          CARPETA_OBJETIVO: ${{ inputs.carpeta_objetivo }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python script_v2.py

      - name: Guardar Memoria Rectificada en GitHub
        if: always()
        run: |
          git config --global user.name "Bot-Memoria-v2"
          git config --global user.email "bot@github.com"
          git pull --rebase origin main || true
          git add RESTREPO_2_IA_memoria_*.csv || true
          git commit -m "Rectificación de radicados ALMA- en Radicadas [skip ci]" || echo "Sin cambios"
          git push origin main || true
